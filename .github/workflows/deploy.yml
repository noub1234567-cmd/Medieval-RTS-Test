name: Build and Deploy Test Game

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: test-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          repository: noub1234567-cmd/Medieval-RTS-Mobile
          ref: building-upgrades
      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir templates && unzip -q templates.tpz -d templates
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Import and export game
        run: |
          godot --headless --editor --path . --quit
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
